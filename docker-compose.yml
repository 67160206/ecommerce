services:
  backend:
    build: ./backend
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    volumes:
      - dbdata:/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  dbdata:
